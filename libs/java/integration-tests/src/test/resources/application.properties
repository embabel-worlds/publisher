spring.application.name=it-realm
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.datasource.url=jdbc:h2:mem:it;DB_CLOSE_DELAY=-1
embabel.realm.name=billing
embabel.realm.title=Billing
embabel.realm.description=Customers and invoices, for the integration tests.
embabel.realm.maturity=experimental
embabel.realm.auth.token=test-token
